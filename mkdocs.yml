site_name: Swarm Pointer Protocol
site_description: Minimal authenticated pointer distribution for autonomous actors
site_url: https://drefetr.github.io/swarm-pointer-protocol/

repo_name: Drefetr/swarm-pointer-protocol
repo_url: https://github.com/Drefetr/swarm-pointer-protocol
edit_uri: edit/main/site-docs/

docs_dir: site-docs
site_dir: site

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - How SPP Works:
      - Architecture: architecture.md
      - Core Concepts: concepts.md
      - Relays: relays.md
      - Federation: federation.md
  - Implementation:
      - Implementations: implementations.md
      - Conformance: conformance.md
  - Reference:
      - Security: security.md
      - v1 Release: release-v1.md
      - Protocol Reference: reference.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
